<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Sin conexión | adricamente</title>
<!-- La página que enseña el service worker cuando no hay red. Es la
     única que guarda, así que no lleva nada de nadie, y los estilos van
     dentro: portal.css no está guardado y sin red no llegaría. -->
<style>
  :root{color-scheme:light;--bg:#FAF9F5;--ink:#25231F;--ink-2:#52504A;--accent:#1F5474}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Segoe UI",system-ui,sans-serif}
  main{max-width:430px;margin:0 auto;padding:min(14vh,90px) 20px 60px}
  .marca{font-weight:800;font-size:18px;color:var(--accent);margin:0 0 28px}
  h1{font-size:30px;line-height:1.1;margin:0 0 12px}
  p{margin:0 0 16px;color:var(--ink-2)}
  a{display:inline-block;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:8px}
  a:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="marca">adricamente</p>
  <h1>Sin conexión</h1>
  <p>Tu cuenta necesita internet para abrirse: lo tuyo no se guarda en este móvil, a propósito.</p>
  <p>Cuando vuelvas a tener conexión, inténtalo otra vez.</p>
  <p><a href="./">Volver a intentarlo</a></p>
  <p>¿En peligro ahora? Llama al 024 o al 112.</p>
</main>
</body>
</html>
